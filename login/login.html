<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión - Papelería</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <div class="caja-login">
        <h2>Iniciar sesión</h2>

        <!-- 
            Este formulario envía los datos por método POST 
            al archivo login.php, que es quien habla con la base de datos.
        -->
        <form action="login.php" method="POST">

            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Entrar</button>

        </form>

        <p class="enlace">¿No tenés cuenta? <a href="registro.html">Creá una acá</a></p>
    </div>

</body>
</html>
